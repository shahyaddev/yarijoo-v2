# Infrastructure only — postgres, redis, minio
# Use this for local development while running backend/frontend natively:
#   docker compose -f docker-compose.infra.yml up -d
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: yarijoo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yarijoo}
      POSTGRES_USER: ${POSTGRES_USER:-yarijoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yarijoo_dev_pass}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-yarijoo} -d ${POSTGRES_DB:-yarijoo}' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - yarijoo_net

  redis:
    image: redis:7-alpine
    container_name: yarijoo_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_pass} --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_dev_pass}', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - yarijoo_net

  minio:
    image: minio/minio:latest
    container_name: yarijoo_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live' ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - yarijoo_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  yarijoo_net:
    driver: bridge
